name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write

jobs:
    release:
        name: Release app version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install build tooling
              run: pip install splunk-add-on-ucc-framework
            - name: Build add-on
              run: |
                  VERSION=$(python -c "import json; print(json.load(open('globalConfig.json'))['meta']['version'])")
                  ucc-gen build --source package --ta-version "$VERSION"
                  ucc-gen package --path output/slack_alerts
            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                      --title "Release ${GITHUB_REF_NAME}" \
                      --generate-notes \
                      slack_alerts-*.tar.gz

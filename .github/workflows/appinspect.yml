name: App Inspect

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    appinspect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
            - name: Install build tooling
              run: pip install splunk-add-on-ucc-framework splunk-appinspect
            - name: Build add-on
              run: |
                  VERSION=$(python -c "import json; print(json.load(open('globalConfig.json'))['meta']['version'])")
                  ucc-gen build --source package --ta-version "$VERSION"
                  ucc-gen package --path output/slack_alerts
            - uses: actions/upload-artifact@v4
              with:
                  name: app-package
                  path: slack_alerts-*.tar.gz
            - name: Run App Inspect (Splunk Cloud)
              run: |
                  set +e
                  splunk-appinspect inspect slack_alerts-*.tar.gz \
                      --mode precert \
                      --included-tags cloud \
                      --ci
                  code=$?
                  set -e
                  # --ci exit codes: 101 failures, 104 future-failures, 103 warnings-only.
                  # Gate the build on failures; allow warnings-only (dependency-driven) to pass.
                  if [ "$code" = "103" ]; then
                      echo "App Inspect returned warnings only (exit 103); treating as pass."
                      exit 0
                  fi
                  exit $code
